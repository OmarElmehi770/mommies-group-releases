<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mommies-group-releases/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mommies Group (جروب الماميز) — Your smart companion for early childhood development. Download the official Android APK to track milestones, chat with Bloom AI, book specialists, and manage treatment plans.">
  <meta name="theme-color" content="#2E8B8B">

  <!-- Open Graph metadata -->
  <meta property="og:title" content="Mommies Group — Download Android App">
  <meta property="og:description" content="Your smart companion for early childhood development (جروب الماميز). Track milestones, chat with Bloom AI, book specialists, and keep care plans synced.">
  <meta property="og:type" content="website">

  <!-- iOS / mobile web app meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mommies Group">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mommies Group — Download Android App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FAF9F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #mindbloom-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(circle at top right, rgba(184, 196, 242, 0.28), transparent 50%),
                  #FAF9F6;
      transition: opacity 0.28s ease;
    }

    #mindbloom-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .mb-spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3.5px solid rgba(184, 196, 242, 0.45);
      border-top-color: #2E8B8B;
      animation: mb-spin 0.85s linear infinite;
    }

    .mb-label {
      color: #1E293B;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .mb-sub {
      color: #2E8B8B;
      font-size: 14px;
      font-weight: 500;
    }

    @keyframes mb-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="mindbloom-loader" aria-label="Loading MindBloom">
    <div class="mb-spinner"></div>
    <div class="mb-label">MindBloom</div>
    <div class="mb-sub">جروب الماميز</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('mindbloom-loader');
      if (!loader) return;
      loader.classList.add('fade-out');
      window.setTimeout(function () {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
